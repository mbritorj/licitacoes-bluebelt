name: Robô de licitações Blue Belt

on:
  schedule:
    # horários em UTC: 09:45 = 06:45 em Brasília (todo dia) e 15:45 = 12:45 (dias úteis)
    - cron: "45 9 * * *"
    - cron: "45 15 * * 1-5"
  workflow_dispatch: {}   # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: robo-licitacoes-bluebelt
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Testar a classificação
        run: python tests/teste_classificacao.py

      - name: Coletar licitações no PNCP
        run: python robo.py

      - name: Publicar resultado
        run: |
          git config user.name "robo-licitacoes"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza licitações $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git pull --rebase
            git push
          fi
